<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rest here</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 42%, #191c22 0%, #0d0f12 58%, #07080a 100%);
      color: #d6d9df;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }

    .top-note {
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(214, 217, 223, 0.35);
    }

    .center {
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .ember {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d89b62;
      box-shadow:
        0 0 18px rgba(216, 155, 98, 0.75),
        0 0 48px rgba(216, 155, 98, 0.35);
      animation: flicker 3.8s infinite ease-in-out;
    }

    @keyframes flicker {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    .quote {
      font-size: 20px;
      line-height: 1.65;
      font-weight: 400;
      color: #e4e7ec;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .quote.fade {
      opacity: 0;
      transform: translateY(6px);
    }

    .sub {
      font-size: 13px;
      color: rgba(214, 217, 223, 0.42);
      letter-spacing: 0.06em;
    }

    .bottom-note {
      font-size: 12px;
      color: rgba(214, 217, 223, 0.28);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="top-note">waystation</div>

  <div class="center">
    <div class="ember"></div>
    <div class="quote" id="quote">
      Rest for a moment, traveler. The world won’t run away while you simply breathe.
    </div>
    <div class="sub" id="counter">1 / 7</div>
  </div>

  <div class="bottom-note">tap anywhere to drift</div>

  <script>
    const quotes = [
      "Rest for a moment, traveler. The world won’t run away while you simply breathe.",
      "Not every day is meant for sprinting. Some days exist just to make it to evening.",
      "When you move too fast, you stop noticing where the road is actually taking you.",
      "Your exhaustion isn’t weakness. It’s proof you’ve been carrying something heavy for a long time.",
      "Sometimes the wisest step forward is sitting in the quiet and proving nothing to anyone.",
      "Nobody is late to their own life. Everyone walks in different weather.",
      "Stay here a little while. No noise, no rush, no roles to play."
    ];

    let index = 0;
    const quoteEl = document.getElementById("quote");
    const counterEl = document.getElementById("counter");

    document.body.addEventListener("click", () => {
      quoteEl.classList.add("fade");

      setTimeout(() => {
        index = (index + 1) % quotes.length;
        quoteEl.textContent = quotes[index];
        counterEl.textContent = `${index + 1} / ${quotes.length}`;
        quoteEl.classList.remove("fade");
      }, 300);
    });
  </script>
</body>
</html>
